
services:
  backend1:
    build: .
    env_file:
      - .env
    expose:
      - "5000"
    restart: unless-stopped

  backend2:
    build: .
    env_file:
      - .env
    expose:
      - "5000"
    restart: unless-stopped

  backend3:
    build: .
    env_file:
      - .env
    expose:
      - "5000"
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped
