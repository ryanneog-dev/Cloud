
services:
  backend1:
    build: .
    env_file:
      - .env
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/instance')"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend2:
    build: .
    env_file:
      - .env
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/instance')"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend3:
    build: .
    env_file:
      - .env
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/instance')"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
    restart: unless-stopped
